---
name: Cache Cargo
description: Cache Rust cargo registry, git sources, and build target directory.

runs:
  using: composite
  steps:
    - id: cache_cargo
      name: Cache Cargo
      uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target/
        key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-cargo-
