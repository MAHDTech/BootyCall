---
name: Report Status
description: Report CI status to the GitHub commit status API.

inputs:
  result:
    description: "Outcome of the step to check (e.g. steps.build.outcome)"
    required: true
  success-message:
    description: "Message when the step succeeded"
    required: true
  failure-message:
    description: "Message when the step failed"
    required: true
  github-token:
    description: "GitHub token for API calls"
    required: true
  workflow-name:
    description: "Workflow name for the status context"
    required: true
  repository:
    description: "Repository in owner/repo format"
    required: true
  sha:
    description: "Commit SHA to report status on"
    required: true
  run-url:
    description: "URL to the workflow run"
    required: true

runs:
  using: composite
  steps:
    - id: report_status
      name: Report Status
      shell: bash
      # Inputs go through env vars (not inline ${{ }} in the script) to avoid
      # shell injection.
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RESULT_INPUT: ${{ inputs.result }}
        SUCCESS_MESSAGE: ${{ inputs.success-message }}
        FAILURE_MESSAGE: ${{ inputs.failure-message }}
        WORKFLOW_NAME: ${{ inputs.workflow-name }}
        REPOSITORY: ${{ inputs.repository }}
        SHA: ${{ inputs.sha }}
        RUN_URL: ${{ inputs.run-url }}
      run: |
        if [[ "${RESULT_INPUT}" == "success" ]]; then
          STATE="success"
          DESCRIPTION="${SUCCESS_MESSAGE}"
        else
          STATE="failure"
          DESCRIPTION="${FAILURE_MESSAGE}"
        fi
        # A PR from a fork gets a read-only GITHUB_TOKEN regardless of the
        # workflow's `statuses: write`, so this write 403s and used to fail the
        # job for every external contributor. The commit-status API is largely
        # redundant with the checks UI, so treat a write failure as a warning,
        # not a job failure.
        if ! gh api \
          "repos/${REPOSITORY}/statuses/${SHA}" \
          -f state="${STATE}" \
          -f context="${WORKFLOW_NAME}" \
          -f description="${DESCRIPTION}" \
          -f target_url="${RUN_URL}"; then
          echo "::warning::Could not report CI commit status (expected on fork PRs with a read-only token)"
        fi
