name: CI

on:
  pull_request:
    branches:
      - main
      - master
      - trunk
  # Also run on pushes to the release branches so the Release workflow
  # (which fires on the same event) can gate on this workflow completing.
  push:
    branches:
      - main
      - master
      - trunk
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  ##################################################
  # Validate PR - Title check for Conventional Commits
  ##################################################
  validate-pr:
    name: Conventional Commit
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - id: validate_pr_title
        name: Validate PR Title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ##################################################
  # Setup Environment - Warm caches if missed
  ##################################################
  setup-environment:
    name: Setup Environment (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - id: nix_cache_lookup
        name: Lookup Nix Cache
        uses: actions/cache@v6
        with:
          path: /nix
          key: ${{ runner.os }}-${{ runner.arch }}-nix-${{ hashFiles('devenv/default.nix', 'flake.nix', 'flake.lock') }}
          lookup-only: true

      - id: cargo_cache_lookup
        name: Lookup Cargo Cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          lookup-only: true

      - id: get_repository_owner
        name: Get lowercased repository owner
        if: steps.nix_cache_lookup.outputs.cache-hit != 'true' || steps.cargo_cache_lookup.outputs.cache-hit != 'true'
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - id: setup_devenv
        name: Setup Devenv
        if: steps.nix_cache_lookup.outputs.cache-hit != 'true' || steps.cargo_cache_lookup.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ steps.get_repository_owner.outputs.owner }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skip-push: ${{ secrets.CACHIX_AUTH_TOKEN == '' }}

      - id: cache_cargo
        name: Cache Cargo
        if: steps.nix_cache_lookup.outputs.cache-hit != 'true' || steps.cargo_cache_lookup.outputs.cache-hit != 'true'
        uses: ./.github/actions/cache-cargo

      - id: warm_cargo
        name: Warm Cargo Cache
        if: steps.cargo_cache_lookup.outputs.cache-hit != 'true'
        shell: bash -c "nix develop --impure -c bash -- {0}"
        run: cargo test --no-run --workspace

  ##################################################
  # Downstream Granular Parallel Check Jobs
  ##################################################
  ci-version:
    name: Check Version
    runs-on: ubuntu-latest
    needs:
      - setup-environment
    if: always() && needs.setup-environment.result == 'success'
    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - id: get_repository_owner
        name: Get lowercased repository owner
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ steps.get_repository_owner.outputs.owner }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skip-push: "true"

      - id: check_version
        name: Check Version
        shell: bash -c "nix develop --impure -c bash -- {0}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: version --verbose ci

  ci-commit-msg:
    name: Check Commit Messages
    runs-on: ubuntu-latest
    needs:
      - setup-environment
    if: always() && needs.setup-environment.result == 'success'
    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: get_repository_owner
        name: Get lowercased repository owner
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ steps.get_repository_owner.outputs.owner }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skip-push: "true"

      - id: check_commit_messages
        name: Check Commit Messages
        shell: bash -c "nix develop --impure -c bash -- {0}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEFAULT_BRANCH=$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name)
          git fetch origin "$DEFAULT_BRANCH" --depth=1
          convco check "origin/$DEFAULT_BRANCH..HEAD"

  ci-devenv-test:
    name: Devenv Test
    runs-on: ubuntu-latest
    needs:
      - setup-environment
    if: always() && needs.setup-environment.result == 'success'
    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - id: get_repository_owner
        name: Get lowercased repository owner
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ steps.get_repository_owner.outputs.owner }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skip-push: "true"

      - id: run_devenv_tests
        name: Run Devenv Tests
        shell: bash -c "nix develop --impure -c bash -- {0}"
        run: devenv test

      # `devenv test` installs the git hooks but does not run them against the
      # tree, and pre-commit-style hooks only lint staged files — so on a fresh
      # CI checkout with nothing staged the lint hooks (actionlint, cspell,
      # markdownlint, lychee, nixfmt, deadnix, prettier, shellcheck, yamllint,
      # etc.) would check zero files. Run the full battery against ALL files,
      # independent of git staging, so a lint regression fails CI. `prek` is the
      # hook runner provisioned by the dev shell.
      - id: run_hooks_all_files
        name: Run Pre-commit Hooks (all files)
        shell: bash -c "nix develop --impure -c bash -- {0}"
        run: prek run --all-files --show-diff-on-failure

  ci-cargo-test:
    name: Cargo Test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    needs:
      - setup-environment
    if: always() && needs.setup-environment.result == 'success'
    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - id: get_repository_owner
        name: Get lowercased repository owner
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ steps.get_repository_owner.outputs.owner }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skip-push: "true"

      - id: cache_cargo
        name: Cache Cargo
        uses: ./.github/actions/cache-cargo

      - id: run_cargo_tests
        name: Cargo Test
        shell: bash -c "nix develop --impure -c bash -- {0}"
        # --all-features so feature-gated tests (e.g. the OLED `sim` feature)
        # actually run; clippy already lints with --all-features.
        run: cargo test --workspace --all-features

  ci-cargo-clippy:
    name: Cargo Clippy (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    needs:
      - setup-environment
    if: always() && needs.setup-environment.result == 'success'
    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - id: get_repository_owner
        name: Get lowercased repository owner
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ steps.get_repository_owner.outputs.owner }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skip-push: "true"

      - id: cache_cargo
        name: Cache Cargo
        uses: ./.github/actions/cache-cargo

      - id: run_cargo_clippy
        name: Cargo Clippy
        shell: bash -c "nix develop --impure -c bash -- {0}"
        # Match the local pre-commit hook: fail on any warning across the
        # whole workspace and every target (bins, tests, examples).
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  ci-cargo-fmt:
    name: Cargo Format Check
    runs-on: ubuntu-latest
    needs:
      - setup-environment
    if: always() && needs.setup-environment.result == 'success'
    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - id: get_repository_owner
        name: Get lowercased repository owner
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ steps.get_repository_owner.outputs.owner }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skip-push: "true"

      - id: run_cargo_fmt
        name: Cargo Format Check
        # amd64 only — formatting is arch-independent. Guards against a web edit
        # or a bypassed hook regressing formatting on the default branch.
        shell: bash -c "nix develop --impure -c bash -- {0}"
        run: cargo fmt --all -- --check

  ci-cargo-machete:
    name: Cargo Machete
    runs-on: ubuntu-latest
    needs:
      - setup-environment
    if: always() && needs.setup-environment.result == 'success'
    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - id: get_repository_owner
        name: Get lowercased repository owner
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ steps.get_repository_owner.outputs.owner }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skip-push: "true"

      - id: run_cargo_machete
        name: Cargo Machete
        # Fail if a declared dependency is unused (no compilation needed).
        shell: bash -c "nix develop --impure -c bash -- {0}"
        run: cargo machete

  ci-cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    needs:
      - setup-environment
    if: always() && needs.setup-environment.result == 'success'
    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - id: get_repository_owner
        name: Get lowercased repository owner
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ steps.get_repository_owner.outputs.owner }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skip-push: "true"

      - id: run_cargo_deny
        name: Cargo Deny
        # Advisories (RustSec) + licenses + bans + sources per deny.toml. The
        # advisories check fetches the RustSec DB, so this job needs network.
        shell: bash -c "nix develop --impure -c bash -- {0}"
        run: cargo deny check

  ci-flake-check:
    name: Nix Flake Check (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    needs:
      - setup-environment
    if: always() && needs.setup-environment.result == 'success'
    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - id: get_repository_owner
        name: Get lowercased repository owner
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ steps.get_repository_owner.outputs.owner }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skip-push: "true"

      - id: check_flake
        name: Nix Flake Check
        shell: bash -c "nix develop --impure -c bash -- {0}"
        run: >-
          nix flake check
          --accept-flake-config
          --no-build
          --no-eval-cache
          --impure
          --keep-going

  ci-build-assets:
    name: Build Assets & iPXE (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    needs:
      - setup-environment
    if: always() && needs.setup-environment.result == 'success'
    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          # INFRA-6: assets.nix consumes wallpapers tracked in git-lfs.
          # Without lfs: true the checkout leaves 130-byte pointer files,
          # so the assets derivation ends up "shipping" pointer text.
          lfs: true

      - id: get_repository_owner
        name: Get lowercased repository owner
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ steps.get_repository_owner.outputs.owner }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skip-push: "true"

      - id: build_assets
        name: Build Assets & iPXE
        run: nix build .#assets --no-link

  ci-nix-build-bootycall:
    # Exercise the Nix package derivation on both target arches so
    # packages/crate.nix can't silently rot between releases (INFRA-4).
    # Runs alongside the Cargo build; the release workflow reuses the
    # same derivation to produce shipped binaries.
    name: Nix Build bootycall (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    needs:
      - setup-environment
    if: always() && needs.setup-environment.result == 'success'
    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - id: get_repository_owner
        name: Get lowercased repository owner
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ steps.get_repository_owner.outputs.owner }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skip-push: "true"

      - id: nix_build_bootycall
        name: Nix Build bootycall
        run: nix build .#bootycall --no-link --print-out-paths

  ci-statix:
    name: Check Statix
    runs-on: ubuntu-latest
    needs:
      - setup-environment
    if: always() && needs.setup-environment.result == 'success'
    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - id: get_repository_owner
        name: Get lowercased repository owner
        run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
        env:
          OWNER: ${{ github.repository_owner }}

      - id: setup_devenv
        name: Setup Devenv
        uses: ./.github/actions/setup-devenv
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-cache-name: ${{ steps.get_repository_owner.outputs.owner }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skip-push: "true"

      - id: check_statix
        name: Check Statix
        # Use the flake-locked statix from the dev shell rather than
        # `nix run nixpkgs#statix`, which resolves from the ambient registry
        # (non-reproducible; breaks when the channel moves).
        shell: bash -c "nix develop --impure -c bash -- {0}"
        run: statix check

  ##################################################
  # CI Status Aggregator
  ##################################################
  status:
    name: CI Status
    needs:
      - validate-pr
      - ci-version
      - ci-commit-msg
      - ci-devenv-test
      - ci-cargo-test
      - ci-cargo-clippy
      - ci-cargo-fmt
      - ci-cargo-machete
      - ci-cargo-deny
      - ci-flake-check
      - ci-statix
      - ci-build-assets
      - ci-nix-build-bootycall
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - id: checkout_repository
        name: Checkout Repository
        uses: actions/checkout@v7

      - id: write_summary
        name: Write Results Summary
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_HEAD: ${{ github.head_ref }}
          PR_BASE: ${{ github.base_ref }}
        run: |
          status_emoji() {
            case "$1" in
              success)   echo "✅" ;;
              failure)   echo "❌" ;;
              cancelled) echo "⛔" ;;
              skipped)   echo "⏭️" ;;
              *)         echo "⏳" ;;
            esac
          }

          {
            echo "## CI Results"
            echo ""
            if [ "${{ github.event_name }}" == "pull_request" ]; then
              echo "> **PR #${PR_NUMBER}** — ${PR_TITLE}"
              echo "> _${PR_HEAD} → ${PR_BASE}_"
              echo ""
            fi
            echo "💚 Nix & Cargo checks were executed with architecture-specific caching enabled (amd64 / arm64)."
            echo ""
            echo "| Job | Status |"
            echo "|-----|--------|"
            if [ "${{ github.event_name }}" == "pull_request" ]; then
              echo "| PR Title | $(status_emoji '${{ needs.validate-pr.result }}') ${{ needs.validate-pr.result }} |"
            fi
            echo "| Version Check | $(status_emoji '${{ needs.ci-version.result }}') ${{ needs.ci-version.result }} |"
            echo "| Commit Messages | $(status_emoji '${{ needs.ci-commit-msg.result }}') ${{ needs.ci-commit-msg.result }} |"
            echo "| Devenv Test | $(status_emoji '${{ needs.ci-devenv-test.result }}') ${{ needs.ci-devenv-test.result }} |"
            echo "| Cargo Test | $(status_emoji '${{ needs.ci-cargo-test.result }}') ${{ needs.ci-cargo-test.result }} |"
            echo "| Cargo Clippy | $(status_emoji '${{ needs.ci-cargo-clippy.result }}') ${{ needs.ci-cargo-clippy.result }} |"
            echo "| Cargo Format | $(status_emoji '${{ needs.ci-cargo-fmt.result }}') ${{ needs.ci-cargo-fmt.result }} |"
            echo "| Cargo Machete | $(status_emoji '${{ needs.ci-cargo-machete.result }}') ${{ needs.ci-cargo-machete.result }} |"
            echo "| Cargo Deny | $(status_emoji '${{ needs.ci-cargo-deny.result }}') ${{ needs.ci-cargo-deny.result }} |"
            echo "| Nix Flake Check | $(status_emoji '${{ needs.ci-flake-check.result }}') ${{ needs.ci-flake-check.result }} |"
            echo "| Statix Check | $(status_emoji '${{ needs.ci-statix.result }}') ${{ needs.ci-statix.result }} |"
            echo "| Build Assets & iPXE | $(status_emoji '${{ needs.ci-build-assets.result }}') ${{ needs.ci-build-assets.result }} |"
            echo "| Nix Build bootycall | $(status_emoji '${{ needs.ci-nix-build-bootycall.result }}') ${{ needs.ci-nix-build-bootycall.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - id: check_failures
        name: Check for Failures
        run: |
          ALL_JOBS="${{ needs.validate-pr.result }},${{ needs.ci-version.result }},${{ needs.ci-commit-msg.result }},${{ needs.ci-devenv-test.result }},${{ needs.ci-cargo-test.result }},${{ needs.ci-cargo-clippy.result }},${{ needs.ci-cargo-fmt.result }},${{ needs.ci-cargo-machete.result }},${{ needs.ci-cargo-deny.result }},${{ needs.ci-flake-check.result }},${{ needs.ci-statix.result }},${{ needs.ci-build-assets.result }},${{ needs.ci-nix-build-bootycall.result }}"
          if echo "${ALL_JOBS}" | grep -qE "(failure|cancelled)"; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi
          echo "All CI checks passed!"

      - id: report_status
        name: Report Status
        if: always()
        uses: ./.github/actions/report-status
        with:
          result: ${{ steps.check_failures.outcome }}
          success-message: "All CI checks passed!"
          failure-message: "One or more CI checks failed!"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          workflow-name: "CI Status"
          repository: ${{ github.repository }}
          sha: ${{ github.sha }}
          run-url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
