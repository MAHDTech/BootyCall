---
# Global

debug: false
quiet: false
insecure: false
timeout: 10m

# Database
db:
  skip-update: false
  no-progress: true
  repository:
    - "public.ecr.aws/aquasecurity/trivy-db:2"
    - "ghcr.io/aquasecurity/trivy-db:2"
    - "aquasec/trivy-db:2"
  java-repository:
    - "public.ecr.aws/aquasecurity/trivy-java-db:1"
    - "ghcr.io/aquasecurity/trivy-java-db:1"
    - "aquasec/trivy-java-db:1"

# Report
# INFRA-8: keep this in sync with `.github/workflows/trivy.yml`, which
# overrides with `--exit-code 0`. The scan is informational: findings
# still upload SARIF for GitHub code scanning, but they don't fail the
# workflow. If we ever want CI to break on vulns, change both places
# together.
exit-code: 0
format: table
report: all
dependency-tree: true
list-all-pkgs: true
severity:
  - UNKNOWN
  - LOW
  - MEDIUM
  - HIGH
  - CRITICAL

# Scan
scan:
  show-suppressed: false
  detection-priority: precise
  scanners:
    - vuln
    - secret
  skip-files:
    - .env
  skip-dirs:
    - .devenv
    - .direnv
    - .git
    - target

# Package
pkg:
  include-dev-deps: true
  types:
    - os
    - library

# Misconfiguration
misconfiguration:
  terraform:
    exclude-downloaded-modules: false
  checks-bundle-repository: "ghcr.io/aquasecurity/trivy-checks:1"
